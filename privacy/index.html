<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인정보 처리방침 — QuickBoard</title>
  <meta name="description" content="QuickBoard(quickboard.club) Privacy Policy / 개인정보 처리방침.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://quickboard.club/privacy/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0d0d0d;
      color: #c9bfa8;
      font-family: 'Rajdhani', sans-serif;
      padding: 32px 20px 80px;
      line-height: 1.7;
    }

    .container { max-width: 720px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      color: #6a6a6a;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
      transition: color 0.15s;
    }
    .back-link:hover { color: #c8a028; }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      color: #e8d5a0;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .subtitle { font-size: 0.95rem; color: #7a6a4a; margin-bottom: 32px; }

    section {
      margin-bottom: 28px;
      padding: 20px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
    }

    section h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      color: #c8a028;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    section p, section li { color: #a8a08c; font-size: 0.95rem; margin-bottom: 8px; }
    section ul { padding-left: 18px; margin-bottom: 8px; }

    a { color: #c8a028; text-decoration: none; }
    a:hover { text-decoration: underline; }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #4a4a4a;
      font-size: 0.85rem;
    }
    footer a { color: #6a6a6a; }
    footer a:hover { color: #c8a028; }

    .lang-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      display: inline-flex;
      align-items: center;
      gap: 0;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      padding: 3px;
      cursor: pointer;
      z-index: 1000;
      font-family: inherit;
      transition: border-color 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .lang-toggle:hover { border-color: #c8a028; }
    .lang-toggle:focus-visible { outline: 2px solid #c8a028; outline-offset: 2px; }
    .lang-opt {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #6a6a6a;
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }
    .lang-toggle.lang-ko .lang-opt[data-lang="ko"],
    .lang-toggle.lang-en .lang-opt[data-lang="en"] {
      background: #c8a028;
      color: #0d0d0d;
    }
  </style>
</head>
<body>
  <button class="lang-toggle" id="lang-toggle" type="button" role="switch" aria-label="Language toggle">
    <span class="lang-opt" data-lang="ko">KO</span>
    <span class="lang-opt" data-lang="en">EN</span>
  </button>

  <div class="container">
    <a class="back-link" href="/" id="back-link">← 메인으로</a>

    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>

    <section><h2 id="s1-h"></h2><div id="s1-b"></div></section>
    <section><h2 id="s2-h"></h2><div id="s2-b"></div></section>
    <section><h2 id="s3-h"></h2><div id="s3-b"></div></section>
    <section><h2 id="s4-h"></h2><div id="s4-b"></div></section>
    <section><h2 id="s5-h"></h2><div id="s5-b"></div></section>
    <section><h2 id="s6-h"></h2><div id="s6-b"></div></section>
    <section><h2 id="s7-h"></h2><div id="s7-b"></div></section>
    <section><h2 id="s8-h"></h2><div id="s8-b"></div></section>
    <section><h2 id="s9-h"></h2><div id="s9-b"></div></section>

    <footer>
      <p>© QuickBoard · <a href="/">quickboard.club</a></p>
    </footer>
  </div>

  <script>
    const i18n = {
      ko: {
        title: '개인정보 처리방침',
        subtitle: 'QuickBoard · 시행일 2026-05-01',
        backLink: '← 메인으로',
        s1h: '제1조 (개요)',
        s1b: `
          <p>QuickBoard(이하 ‘서비스’)는 보드게임 점수계산을 도와주는 무료 도구입니다. 서비스는 별도의 백엔드 서버나 사용자 분석 도구를 운영하지 않으며, 회원가입·로그인 절차도 없습니다.</p>
          <p><strong>서비스 운영자는 이용자로부터 어떠한 개인정보도 직접 수집하지 않습니다.</strong></p>`,
        s2h: '제2조 (제3자 광고 — Google AdSense / AdMob)',
        s2b: `
          <p>서비스에는 운영 비용 충당을 위한 광고가 포함됩니다. 광고는 다음 Google 서비스를 통해 게재됩니다.</p>
          <ul>
            <li>Google AdSense (웹사이트)</li>
            <li>Google AdMob (iOS / Android 모바일 앱)</li>
          </ul>
          <p>Google은 광고 게재 과정에서 다음 정보를 직접 수집할 수 있습니다.</p>
          <ul>
            <li>IP 주소</li>
            <li>쿠키 및 광고 식별자(IDFA, AAID)</li>
            <li>단말 기종 및 브라우저 정보</li>
            <li>서비스 이용 기록</li>
          </ul>
          <p>이 정보는 <strong>Google이 직접 수집·처리</strong>하며, QuickBoard 운영자는 해당 데이터에 접근하지 않습니다.</p>
          <p>QuickBoard는 <strong>비개인화 광고(non-personalized ads)만</strong> 요청합니다.</p>
          <p>자세한 내용:</p>
          <ul>
            <li>Google 개인정보처리방침: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">policies.google.com/privacy</a></li>
            <li>Google 광고 파트너 사이트 정책: <a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener noreferrer">policies.google.com/technologies/partner-sites</a></li>
          </ul>`,
        s3h: '제3조 (기기 내부 저장 데이터)',
        s3b: `
          <p>서비스 이용 과정에서 다음 데이터가 사용자 기기 내부에만 저장될 수 있으며, <strong>외부 서버로 전송되지 않습니다.</strong></p>
          <ul>
            <li>게임 진행 점수 — 앱 메모리 / 임시 저장</li>
            <li>언어 설정(<code>quickboard.lang</code>) — 웹 브라우저 localStorage</li>
          </ul>
          <p>브라우저 데이터(쿠키·로컬 저장소) 삭제 또는 앱 삭제 시 위 데이터는 함께 제거됩니다.</p>`,
        s4h: '제4조 (호스팅 및 인프라)',
        s4b: `
          <ul>
            <li>웹 사이트는 GitHub Pages(GitHub, Inc.)에서 호스팅됩니다. GitHub은 표준 서버 액세스 로그(IP, User-Agent 등)를 일정 기간 보유할 수 있으며, QuickBoard 운영자는 해당 로그에 접근하지 않습니다.</li>
            <li>iOS / Android 앱은 각각 Apple App Store 및 Google Play Store에서 배포됩니다. 다운로드·설치 통계는 해당 플랫폼의 정책을 따릅니다.</li>
          </ul>`,
        s5h: '제5조 (이용자 권리 — 광고 추적 거부)',
        s5b: `
          <p>이용자는 아래 방법으로 광고 식별자 추적을 거부하거나 재설정할 수 있습니다.</p>
          <ul>
            <li>iOS: 설정 → 개인정보 보호 및 보안 → 추적 → 추적 요청 허용 끄기</li>
            <li>Android: 설정 → Google → 광고 → 광고 ID 재설정 / 맞춤설정 사용 안 함</li>
            <li>웹: 브라우저 설정에서 쿠키 차단 또는 시크릿/개인정보 보호 모드 사용</li>
          </ul>`,
        s6h: '제6조 (만 14세 미만 아동)',
        s6b: '<p>서비스는 회원가입 및 직접적인 개인정보 수집이 없으므로, 만 14세 미만 아동도 보호자 동의 절차 없이 이용할 수 있습니다. 다만 광고 게재 및 광고 식별자 사용에 우려가 있는 경우 보호자의 안내 하에 이용해 주시기 바랍니다.</p>',
        s7h: '제7조 (문의처)',
        s7b: `
          <p>QuickBoard는 1인 운영 서비스이며, 개인정보 처리 관련 문의는 다음 채널로 접수해 주시기 바랍니다.</p>
          <ul>
            <li>지원 페이지: <a href="/support/">quickboard.club/support</a></li>
            <li>카카오톡 오픈채팅: <a href="https://open.kakao.com/o/sEf7kJsi" target="_blank" rel="noopener noreferrer">open.kakao.com/o/sEf7kJsi</a></li>
          </ul>`,
        s8h: '제8조 (권익침해 구제 — 대한민국)',
        s8b: `
          <p>개인정보 침해에 대한 신고나 상담이 필요한 경우 아래 기관에 문의하실 수 있습니다.</p>
          <ul>
            <li>개인정보 침해신고센터(한국인터넷진흥원): privacy.kisa.or.kr / (국번없이) 118</li>
            <li>개인정보 분쟁조정위원회: www.kopico.go.kr / 1833-6972</li>
            <li>대검찰청 사이버수사과: spo.go.kr</li>
            <li>경찰청 사이버수사국: cyberbureau.police.go.kr / 182</li>
          </ul>`,
        s9h: '제9조 (개인정보 처리방침의 변경)',
        s9b: `
          <p>이 개인정보 처리방침의 내용 추가, 삭제 및 수정이 있을 경우 본 페이지를 통해 사전 공지합니다.</p>
          <p>시행일: 2026-05-01</p>`,
      },
      en: {
        title: 'Privacy Policy',
        subtitle: 'QuickBoard · Effective from 2026-05-01',
        backLink: '← Back to Home',
        s1h: 'Article 1 (Overview)',
        s1b: `
          <p>QuickBoard (the "Service") is a free tool that helps you keep score for board games. The Service does not operate any backend server or analytics tool, and there is no account registration or login.</p>
          <p><strong>The Service operator does not directly collect any personal information from users.</strong></p>`,
        s2h: 'Article 2 (Third-Party Ads — Google AdSense / AdMob)',
        s2b: `
          <p>The Service includes advertisements to support operating costs. Ads are delivered through the following Google services:</p>
          <ul>
            <li>Google AdSense (website)</li>
            <li>Google AdMob (iOS / Android mobile apps)</li>
          </ul>
          <p>In the course of serving ads, Google may directly collect the following:</p>
          <ul>
            <li>IP address</li>
            <li>Cookies and advertising identifiers (IDFA, AAID)</li>
            <li>Device model and browser information</li>
            <li>Service usage logs</li>
          </ul>
          <p>This information is <strong>collected and processed directly by Google</strong>. The QuickBoard operator does not have access to it.</p>
          <p>QuickBoard requests <strong>non-personalized ads only</strong>.</p>
          <p>For details:</p>
          <ul>
            <li>Google Privacy Policy: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">policies.google.com/privacy</a></li>
            <li>How Google uses information from sites or apps that use our services: <a href="https://policies.google.com/technologies/partner-sites" target="_blank" rel="noopener noreferrer">policies.google.com/technologies/partner-sites</a></li>
          </ul>`,
        s3h: 'Article 3 (Locally Stored Data)',
        s3b: `
          <p>The following data may be stored only on your device during use of the Service and is <strong>never transmitted to any external server</strong>:</p>
          <ul>
            <li>In-progress game scores — kept in app memory / temporary storage</li>
            <li>Language preference (<code>quickboard.lang</code>) — web browser localStorage</li>
          </ul>
          <p>Clearing your browser data or uninstalling the app removes the above data as well.</p>`,
        s4h: 'Article 4 (Hosting and Infrastructure)',
        s4b: `
          <ul>
            <li>The website is hosted by GitHub Pages (GitHub, Inc.). GitHub may retain standard server access logs (IP, User-Agent, etc.) for a period; the QuickBoard operator does not access these logs.</li>
            <li>The iOS / Android apps are distributed via the Apple App Store and Google Play Store. Download and installation statistics follow the respective platforms' policies.</li>
          </ul>`,
        s5h: 'Article 5 (User Rights — Opt-out of Ad Tracking)',
        s5b: `
          <p>You can opt out of advertising identifier tracking or reset it as follows:</p>
          <ul>
            <li>iOS: Settings → Privacy & Security → Tracking → Turn off "Allow Apps to Request to Track"</li>
            <li>Android: Settings → Google → Ads → Reset advertising ID / Opt out of personalization</li>
            <li>Web: Block cookies in your browser settings, or use Incognito/Private mode</li>
          </ul>`,
        s6h: 'Article 6 (Children Under 14)',
        s6b: '<p>The Service does not require account registration or directly collect personal information, so children under 14 may use it without parental consent. Parents are nevertheless encouraged to supervise use in light of advertising and advertising-identifier concerns.</p>',
        s7h: 'Article 7 (Contact)',
        s7b: `
          <p>QuickBoard is operated by a single individual. For inquiries regarding personal data, please use:</p>
          <ul>
            <li>Support page: <a href="/support/">quickboard.club/support</a></li>
            <li>KakaoTalk Open Chat: <a href="https://open.kakao.com/o/sEf7kJsi" target="_blank" rel="noopener noreferrer">open.kakao.com/o/sEf7kJsi</a></li>
          </ul>`,
        s8h: 'Article 8 (Remedies for Privacy Violations — Republic of Korea)',
        s8b: `
          <p>For privacy violation reports or consultations, you may contact:</p>
          <ul>
            <li>Privacy Infringement Report Center (KISA): privacy.kisa.or.kr / 118</li>
            <li>Personal Information Dispute Mediation Committee: www.kopico.go.kr / 1833-6972</li>
            <li>Supreme Prosecutors' Office Cyber Investigation: spo.go.kr</li>
            <li>National Police Agency Cyber Bureau: cyberbureau.police.go.kr / 182</li>
          </ul>`,
        s9h: 'Article 9 (Changes to This Policy)',
        s9b: `
          <p>If there are any additions, deletions, or modifications to this Privacy Policy, they will be announced in advance on this page.</p>
          <p>Effective date: 2026-05-01</p>`,
      }
    };

    const STORAGE_KEY = 'quickboard.lang';

    function applyLang(lang) {
      const t = i18n[lang] || i18n.ko;
      document.title = (lang === 'en' ? 'Privacy Policy — QuickBoard' : '개인정보 처리방침 — QuickBoard');
      document.getElementById('title').textContent = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('back-link').textContent = t.backLink;
      for (let i = 1; i <= 9; i++) {
        document.getElementById(`s${i}-h`).textContent = t[`s${i}h`];
        document.getElementById(`s${i}-b`).innerHTML = t[`s${i}b`];
      }
      document.documentElement.lang = lang === 'en' ? 'en' : 'ko';
      const toggle = document.getElementById('lang-toggle');
      toggle.className = 'lang-toggle lang-' + lang;
      toggle.setAttribute('aria-checked', lang === 'en' ? 'true' : 'false');
    }

    function setLang(lang) {
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {}
      applyLang(lang);
    }

    function getInitialLang() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored === 'ko' || stored === 'en') return stored;
      } catch (_) {}
      const browserLang = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
      return browserLang.startsWith('ko') ? 'ko' : 'en';
    }

    document.getElementById('lang-toggle').addEventListener('click', () => {
      const current = document.documentElement.lang === 'en' ? 'en' : 'ko';
      setLang(current === 'en' ? 'ko' : 'en');
    });
    applyLang(getInitialLang());
  </script>
</body>
</html>
