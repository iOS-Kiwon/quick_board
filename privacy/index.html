<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인정보 처리방침 — QuickBoard</title>
  <meta name="description" content="QuickBoard(quickboard.club) Privacy Policy / 개인정보 처리방침.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://quickboard.club/privacy/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0d0d0d;
      color: #c9bfa8;
      font-family: 'Rajdhani', sans-serif;
      padding: 32px 20px 80px;
      line-height: 1.7;
    }

    .container { max-width: 720px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      color: #6a6a6a;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
      transition: color 0.15s;
    }
    .back-link:hover { color: #c8a028; }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      color: #e8d5a0;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .subtitle { font-size: 0.95rem; color: #7a6a4a; margin-bottom: 32px; }

    section {
      margin-bottom: 28px;
      padding: 20px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
    }

    section h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      color: #c8a028;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    section p, section li { color: #a8a08c; font-size: 0.95rem; margin-bottom: 8px; }
    section ul { padding-left: 18px; margin-bottom: 8px; }

    a { color: #c8a028; text-decoration: none; }
    a:hover { text-decoration: underline; }

    footer {
      margin-top: 40px;
      text-align: center;
      color: #4a4a4a;
      font-size: 0.85rem;
    }
    footer a { color: #6a6a6a; }
    footer a:hover { color: #c8a028; }

    .lang-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 2px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 3px;
      z-index: 1000;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #6a6a6a;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }
    .lang-btn:hover { color: #c8a028; }
    .lang-btn.active { background: #c8a028; color: #0d0d0d; }
  </style>
</head>
<body>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button id="btn-ko" class="lang-btn" type="button">KO</button>
    <button id="btn-en" class="lang-btn" type="button">EN</button>
  </div>

  <div class="container">
    <a class="back-link" href="/" id="back-link">← 메인으로</a>

    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>

    <section><h2 id="s1-h"></h2><div id="s1-b"></div></section>
    <section><h2 id="s2-h"></h2><div id="s2-b"></div></section>
    <section><h2 id="s3-h"></h2><div id="s3-b"></div></section>
    <section><h2 id="s4-h"></h2><div id="s4-b"></div></section>
    <section><h2 id="s5-h"></h2><div id="s5-b"></div></section>
    <section><h2 id="s6-h"></h2><div id="s6-b"></div></section>
    <section><h2 id="s7-h"></h2><div id="s7-b"></div></section>
    <section><h2 id="s8-h"></h2><div id="s8-b"></div></section>
    <section><h2 id="s9-h"></h2><div id="s9-b"></div></section>

    <footer>
      <p>© QuickBoard · <a href="/">quickboard.club</a></p>
    </footer>
  </div>

  <script>
    const i18n = {
      ko: {
        title: '개인정보 처리방침',
        subtitle: 'QuickBoard · 시행일 2026-05-01',
        backLink: '← 메인으로',
        s1h: '제1조 (수집하는 개인정보 항목)',
        s1b: `
          <p>QuickBoard(이하 ‘서비스’)는 별도의 회원가입이나 로그인 절차 없이 누구나 무료로 이용할 수 있는 보드게임 점수계산 서비스입니다. 서비스 운영자는 이용자로부터 직접 수집하는 개인정보가 없습니다.</p>
          <p>다만, 서비스 이용 과정에서 다음 정보가 자동으로 수집될 수 있습니다.</p>
          <ul>
            <li>IP 주소, 쿠키, 광고 식별자(IDFA/AAID), 단말 기종, 브라우저 정보, 서비스 이용 기록</li>
            <li>위 정보는 Google AdSense / AdMob 등 광고 파트너를 통해 자동 수집되어 광고 게재 및 통계 목적에 활용됩니다.</li>
          </ul>`,
        s2h: '제2조 (개인정보의 처리 목적)',
        s2b: `
          <p>자동 수집되는 정보는 다음 목적으로 처리됩니다.</p>
          <ul>
            <li>비개인화 광고 게재(맞춤형 광고 추적은 사용하지 않음)</li>
            <li>서비스 안정성 확인, 부정 이용 방지, 통계 분석</li>
          </ul>`,
        s3h: '제3조 (보유 및 이용 기간)',
        s3b: `
          <p>광고 파트너가 자동 수집하는 정보는 해당 파트너의 정책에 따라 보유 및 처리됩니다. 자세한 내용은 다음을 참고하시기 바랍니다.</p>
          <ul>
            <li>Google 개인정보처리방침: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">policies.google.com/privacy</a></li>
          </ul>
          <p>점수 입력 데이터 등 게임 진행 정보는 외부 서버로 전송되지 않으며, 사용자 기기 내부에서만 임시 보관됩니다.</p>`,
        s4h: '제4조 (개인정보의 제3자 제공)',
        s4b: '<p>서비스는 이용자로부터 직접 수집한 개인정보가 없으므로 제3자에게 제공하는 개인정보가 없습니다. 광고 파트너의 자동 수집 정보는 해당 파트너의 정책을 따릅니다.</p>',
        s5h: '제5조 (개인정보의 처리 위탁)',
        s5b: '<p>현재 서비스는 별도의 개인정보 처리 위탁 업무를 두고 있지 않습니다. 사이트 호스팅은 GitHub Pages를 통해 제공됩니다.</p>',
        s6h: '제6조 (이용자의 권리)',
        s6b: `
          <p>광고 식별자 추적 거부 및 비개인화 광고 설정은 단말 또는 브라우저 설정을 통해 변경할 수 있습니다.</p>
          <ul>
            <li>iOS: 설정 → 개인정보 보호 및 보안 → 추적 → 추적 요청 허용 끄기</li>
            <li>Android: 설정 → Google → 광고 → 광고 ID 재설정 / 맞춤설정 사용 안 함</li>
            <li>웹: 브라우저 설정에서 쿠키 차단</li>
          </ul>`,
        s7h: '제7조 (개인정보 보호책임자 및 문의처)',
        s7b: `
          <p>개인정보 처리 관련 문의는 다음 채널로 접수해 주시기 바랍니다.</p>
          <ul>
            <li>지원 페이지: <a href="/support/">quickboard.club/support</a></li>
            <li>카카오톡 오픈채팅: <a href="https://open.kakao.com/o/sEf7kJsi" target="_blank" rel="noopener noreferrer">open.kakao.com/o/sEf7kJsi</a></li>
          </ul>`,
        s8h: '제8조 (권익침해 구제 방법)',
        s8b: `
          <p>개인정보 침해에 대한 신고나 상담이 필요한 경우 아래 기관에 문의하실 수 있습니다.</p>
          <ul>
            <li>개인정보 침해신고센터(한국인터넷진흥원): privacy.kisa.or.kr / (국번없이) 118</li>
            <li>개인정보 분쟁조정위원회: www.kopico.go.kr / 1833-6972</li>
            <li>대검찰청 사이버수사과: spo.go.kr</li>
            <li>경찰청 사이버수사국: cyberbureau.police.go.kr / 182</li>
          </ul>`,
        s9h: '제9조 (개인정보 처리방침의 변경)',
        s9b: `
          <p>이 개인정보 처리방침의 내용 추가, 삭제 및 수정이 있을 경우 본 페이지를 통해 사전 공지합니다.</p>
          <p>시행일: 2026-05-01</p>`,
      },
      en: {
        title: 'Privacy Policy',
        subtitle: 'QuickBoard · Effective from 2026-05-01',
        backLink: '← Back to Home',
        s1h: 'Article 1 (Personal Information Collected)',
        s1b: `
          <p>QuickBoard (the "Service") is a free board game score calculator available without registration or login. The Service operator does not directly collect personal information from users.</p>
          <p>However, the following information may be automatically collected during use of the Service:</p>
          <ul>
            <li>IP address, cookies, advertising identifiers (IDFA/AAID), device model, browser information, usage logs</li>
            <li>The above is automatically collected through advertising partners such as Google AdSense / AdMob and is used for ad serving and statistics.</li>
          </ul>`,
        s2h: 'Article 2 (Purpose of Processing)',
        s2b: `
          <p>Automatically collected information is processed for the following purposes:</p>
          <ul>
            <li>Non-personalized ad delivery (no personalized ad tracking is used)</li>
            <li>Service stability monitoring, abuse prevention, and statistical analysis</li>
          </ul>`,
        s3h: 'Article 3 (Retention and Use Period)',
        s3b: `
          <p>Information automatically collected by advertising partners is retained and processed according to their policies. For details, please refer to:</p>
          <ul>
            <li>Google Privacy Policy: <a href="https://policies.google.com/privacy" target="_blank" rel="noopener noreferrer">policies.google.com/privacy</a></li>
          </ul>
          <p>Game data such as score inputs is not transmitted to any external server and is stored only temporarily on the user's device.</p>`,
        s4h: 'Article 4 (Disclosure to Third Parties)',
        s4b: '<p>Since the Service does not directly collect personal information from users, no such information is disclosed to third parties. Information automatically collected by advertising partners is governed by the respective partner\'s policies.</p>',
        s5h: 'Article 5 (Outsourcing of Processing)',
        s5b: '<p>The Service does not currently outsource any personal data processing. Site hosting is provided via GitHub Pages.</p>',
        s6h: 'Article 6 (User Rights)',
        s6b: `
          <p>You can opt out of advertising identifier tracking or enable non-personalized ads through your device or browser settings:</p>
          <ul>
            <li>iOS: Settings → Privacy & Security → Tracking → Turn off "Allow Apps to Request to Track"</li>
            <li>Android: Settings → Google → Ads → Reset advertising ID / Opt out of personalization</li>
            <li>Web: Block cookies in your browser settings</li>
          </ul>`,
        s7h: 'Article 7 (Privacy Officer and Contact)',
        s7b: `
          <p>For inquiries regarding personal data processing, please use one of the following channels:</p>
          <ul>
            <li>Support page: <a href="/support/">quickboard.club/support</a></li>
            <li>KakaoTalk Open Chat: <a href="https://open.kakao.com/o/sEf7kJsi" target="_blank" rel="noopener noreferrer">open.kakao.com/o/sEf7kJsi</a></li>
          </ul>`,
        s8h: 'Article 8 (Remedies for Privacy Violations)',
        s8b: `
          <p>If you need to report or consult about a privacy violation, you may contact the following Korean agencies:</p>
          <ul>
            <li>Privacy Infringement Report Center (KISA): privacy.kisa.or.kr / 118</li>
            <li>Personal Information Dispute Mediation Committee: www.kopico.go.kr / 1833-6972</li>
            <li>Supreme Prosecutors' Office Cyber Investigation: spo.go.kr</li>
            <li>National Police Agency Cyber Bureau: cyberbureau.police.go.kr / 182</li>
          </ul>`,
        s9h: 'Article 9 (Changes to This Policy)',
        s9b: `
          <p>If there are any additions, deletions, or modifications to this Privacy Policy, they will be announced in advance on this page.</p>
          <p>Effective date: 2026-05-01</p>`,
      }
    };

    const STORAGE_KEY = 'quickboard.lang';

    function applyLang(lang) {
      const t = i18n[lang] || i18n.ko;
      document.title = (lang === 'en' ? 'Privacy Policy — QuickBoard' : '개인정보 처리방침 — QuickBoard');
      document.getElementById('title').textContent = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('back-link').textContent = t.backLink;
      for (let i = 1; i <= 9; i++) {
        document.getElementById(`s${i}-h`).textContent = t[`s${i}h`];
        document.getElementById(`s${i}-b`).innerHTML = t[`s${i}b`];
      }
      document.documentElement.lang = lang === 'en' ? 'en' : 'ko';
      document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    }

    function setLang(lang) {
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {}
      applyLang(lang);
    }

    function getInitialLang() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored === 'ko' || stored === 'en') return stored;
      } catch (_) {}
      const browserLang = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
      return browserLang.startsWith('ko') ? 'ko' : 'en';
    }

    document.getElementById('btn-ko').addEventListener('click', () => setLang('ko'));
    document.getElementById('btn-en').addEventListener('click', () => setLang('en'));
    applyLang(getInitialLang());
  </script>
</body>
</html>
