            <li>Full House → Not a 3+2 → <strong>0 pts</strong></li>
            <li>Small Straight → No 4-in-a-row → <strong>0 pts</strong></li>
          </ul>
          <p>Dice: <strong>3, 3, 3, 3, 5</strong></p>
          <ul>
            <li>Triples → 3+3+3+3 = <strong>12 pts</strong></li>
            <li>Poker → 3+3+3+3 = <strong>12 pts</strong> (5th die excluded)</li>
            <li>Yacht → Not all 5 the same → <strong>0 pts</strong></li>
          </ul>`,

        strategyH: 'Strategy Tips',
        strategyB: `
          <ul>
            <li><strong>The upper bonus (+35) is practically essential</strong>: Averaging 3 matching dice across Aces–Hexa hits the 63-point threshold.</li>
            <li><strong>Yacht (50 pts) is worth attempting</strong>: If your first roll shows 3–4 of a kind, go for it aggressively.</li>
            <li><strong>Straights are safe categories</strong>: Fixed 30 points means no variance risk.</li>
            <li><strong>Full House vs Poker</strong>: With a 3+2 split, Full House is better; with 4 of a kind, Poker wins.</li>
            <li><strong>Zero scoring is a strategic move</strong>: Sometimes it's better to zero out a tough category early than to leave it for late.</li>
            <li><strong>Choice (max 30) is your insurance</strong>: Save it for the end when you're stuck with a low-value roll.</li>
          </ul>`,

        faqH: 'Frequently Asked Questions',
        faqs: [
          { q: 'How long does a game take?', a: 'About 20–30 minutes for 4 players. Longer with more players.' },
          { q: 'Do I need physical dice?', a: 'Yes — this is a score-tracking aid. Roll your own dice and enter the results here.' },
          { q: 'I entered a wrong score. Can I fix it?', a: 'Yes, tap the category cell again to change the value. Bonus and totals will recalculate automatically.' },
          { q: 'Can I save or share the game results?', a: 'After the game ends, tap "Share Results" to save the result screen as an image or share to another app.' },
          { q: 'Is my score data sent anywhere?', a: 'No. Game progress is stored only in your browser (or app) and is never transmitted externally.' },
          { q: 'Is there a mobile app?', a: 'Yes — iOS and Android apps are in preparation. We will announce them on this page when available.' },
          { q: 'How does Yacht Dice differ from Yatzy?', a: 'The main differences are bonus thresholds and Full House scoring. Yatzy fixes Full House at 25; Yacht Dice sums all 5 dice (max 28).' },
        ],

        linkSupport: 'Support',
        linkPrivacy: 'Privacy Policy',
        linkTerms: 'Terms of Service',
      }
    };

    const STORAGE_KEY = 'quickboard.lang';

    function applyLang(lang) {
      const t = i18n[lang] || i18n.ko;

      document.title = (lang === 'en'
        ? 'Yacht Dice Score Calculator — QuickBoard'
        : 'Yacht Dice Score Calculator — 요트 다이스 점수계산 · QuickBoard');

      document.getElementById('back-link').textContent = t.backLink;
      document.getElementById('page-title').textContent = t.pageTitle;
      document.getElementById('page-subtitle').textContent = t.pageSubtitle;

      ['intro', 'howto', 'cats', 'example', 'strategy', 'faq'].forEach(k => {
        document.getElementById(`${k}-h`).textContent = t[`${k}H`];
      });
      ['intro', 'howto', 'cats', 'example', 'strategy'].forEach(k => {
        document.getElementById(`${k}-b`).innerHTML = t[`${k}B`];
      });

      document.getElementById('faq-list').innerHTML = t.faqs.map(f =>
        `<div class="faq-item"><div class="faq-q">Q. ${f.q}</div><div class="faq-a">A. ${f.a}</div></div>`
      ).join('');

      document.getElementById('link-support').textContent = t.linkSupport;
      document.getElementById('link-privacy').textContent = t.linkPrivacy;
      document.getElementById('link-terms').textContent = t.linkTerms;

      document.documentElement.lang = lang === 'en' ? 'en' : 'ko';
      const toggle = document.getElementById('lang-toggle');
      toggle.className = 'lang-toggle lang-' + lang;
      toggle.setAttribute('aria-checked', lang === 'en' ? 'true' : 'false');
    }

    function setLang(lang) {
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {}
      applyLang(lang);
    }

    function getInitialLang() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored === 'ko' || stored === 'en') return stored;
      } catch (_) {}
      const browserLang = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
      return browserLang.startsWith('ko') ? 'ko' : 'en';
    }

    document.getElementById('lang-toggle').addEventListener('click', () => {
      const current = document.documentElement.lang === 'en' ? 'en' : 'ko';
      setLang(current === 'en' ? 'ko' : 'en');
    });
    applyLang(getInitialLang());
  </script>
</body>
</html>
