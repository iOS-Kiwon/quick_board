<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고객 지원 — QuickBoard</title>
  <meta name="description" content="QuickBoard 고객 지원 페이지. 문의 및 자주 묻는 질문 / Support page with contact and FAQs.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://quickboard.club/support/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0d0d0d;
      color: #c9bfa8;
      font-family: 'Rajdhani', sans-serif;
      padding: 32px 20px 80px;
      line-height: 1.6;
    }

    .container { max-width: 720px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      color: #6a6a6a;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 24px;
      transition: color 0.15s;
    }
    .back-link:hover { color: #c8a028; }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      color: #e8d5a0;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle { font-size: 1rem; color: #7a6a4a; margin-bottom: 40px; }

    section {
      margin-bottom: 36px;
      padding: 24px;
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
    }

    section h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: #c8a028;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    section p { color: #a8a08c; margin-bottom: 10px; }

    .contact-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      margin-top: 12px;
      background: #fae100;
      color: #181600;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 10px;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .contact-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(250, 225, 0, 0.25);
    }

    .contact-note { font-size: 0.88rem; color: #6a6a6a; margin-top: 12px; }

    .faq-item {
      border-top: 1px solid #1f1f1f;
      padding: 16px 0;
    }

    .faq-item:first-of-type { border-top: none; padding-top: 0; }
    .faq-item:last-of-type  { padding-bottom: 0; }

    .faq-question { font-weight: 600; color: #e8d5a0; margin-bottom: 6px; }
    .faq-answer { color: #a8a08c; font-size: 0.95rem; }

    footer {
      margin-top: 48px;
      text-align: center;
      color: #4a4a4a;
      font-size: 0.85rem;
    }
    footer a { color: #6a6a6a; text-decoration: none; }
    footer a:hover { color: #c8a028; }

    .lang-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 2px;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 3px;
      z-index: 1000;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: #6a6a6a;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.5px;
    }
    .lang-btn:hover { color: #c8a028; }
    .lang-btn.active { background: #c8a028; color: #0d0d0d; }
  </style>
</head>
<body>
  <div class="lang-toggle" role="group" aria-label="Language">
    <button id="btn-ko" class="lang-btn" type="button">KO</button>
    <button id="btn-en" class="lang-btn" type="button">EN</button>
  </div>

  <div class="container">
    <a class="back-link" href="/" id="back-link">← 메인으로</a>

    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>

    <section>
      <h2 id="about-h"></h2>
      <div id="about-b"></div>
    </section>

    <section>
      <h2 id="contact-h"></h2>
      <p id="contact-desc"></p>
      <a class="contact-button" href="https://open.kakao.com/o/sEf7kJsi" target="_blank" rel="noopener noreferrer" id="contact-btn"></a>
      <p class="contact-note" id="contact-note"></p>
    </section>

    <section>
      <h2 id="faq-h"></h2>
      <div id="faq-list"></div>
    </section>

    <footer>
      <p>© QuickBoard · <a href="/">quickboard.club</a></p>
    </footer>
  </div>

  <script>
    const i18n = {
      ko: {
        title: '고객 지원',
        subtitle: 'QuickBoard · 보드게임 점수계산',
        backLink: '← 메인으로',
        aboutH: '📋 서비스 소개',
        aboutB: `
          <p>QuickBoard는 <strong>스컬킹(Skull King)</strong>과 <strong>요트 다이스(Yacht Dice)</strong> 보드게임의 점수를 자동으로 계산해주는 무료 서비스입니다.</p>
          <p>웹과 모바일(iOS / Android) 앱에서 모두 이용하실 수 있으며, 최대 8명까지 멀티플레이어를 지원합니다. 라운드별 점수 입력만으로 누적 합계와 보너스를 자동 계산해드립니다.</p>`,
        contactH: '💬 문의하기',
        contactDesc: '버그 신고, 기능 제안, 기타 문의 사항은 카카오톡 오픈채팅으로 연락 주세요. 빠르게 확인 후 답변 드리겠습니다.',
        contactBtn: '카카오톡 오픈채팅 문의',
        contactNote: '※ 별도의 회원가입 없이 익명으로 문의 가능합니다.',
        faqH: '❓ 자주 묻는 질문',
        faqs: [
          { q: 'Q. 앱 사용에 비용이 발생하나요?', a: 'A. 모든 기능은 무료로 제공됩니다. 운영을 위해 하단에 광고가 표시될 수 있습니다.' },
          { q: 'Q. 점수 입력 데이터가 저장되나요?', a: 'A. 진행 중인 게임 데이터는 앱 내부에서만 임시로 보관되며, 외부 서버에 전송되거나 영구 저장되지 않습니다. 게임 종료 후 결과를 공유할 수 있습니다.' },
          { q: 'Q. 인터넷 연결이 필요한가요?', a: 'A. 점수 계산 기능 자체는 오프라인에서도 동작합니다. 광고 표시에는 인터넷 연결이 필요합니다.' },
          { q: 'Q. 최대 몇 명까지 플레이할 수 있나요?', a: 'A. 두 게임 모두 2명부터 최대 8명까지 지원합니다.' },
          { q: 'Q. 게임 진행 중 점수를 잘못 입력했어요. 수정할 수 있나요?', a: 'A. 네, 이전 라운드로 이동해 점수를 다시 입력하실 수 있습니다. 수정한 값에 따라 합계가 자동으로 재계산됩니다.' },
          { q: 'Q. 결과를 다른 사람과 공유할 수 있나요?', a: 'A. 게임 종료 후 \'결과 공유\' 버튼을 통해 카카오톡, 메시지 등 원하는 앱으로 결과 텍스트를 공유할 수 있습니다.' },
          { q: 'Q. 개인정보를 수집하나요?', a: 'A. 별도의 회원가입이나 개인정보 수집은 없습니다. 광고 식별자(IDFA/AAID)도 추적 목적으로 사용하지 않으며, 비개인화 광고만 노출됩니다.' },
        ],
      },
      en: {
        title: 'Support',
        subtitle: 'QuickBoard · Board Game Score Calculator',
        backLink: '← Back to Home',
        aboutH: '📋 About the Service',
        aboutB: `
          <p>QuickBoard is a free service that automatically calculates scores for the <strong>Skull King</strong> and <strong>Yacht Dice</strong> board games.</p>
          <p>Available on web and mobile (iOS / Android), supporting up to 8 players. Just enter each round's scores and we'll automatically calculate cumulative totals and bonuses.</p>`,
        contactH: '💬 Contact',
        contactDesc: 'For bug reports, feature suggestions, or other inquiries, please contact us via KakaoTalk Open Chat. We\'ll get back to you as soon as possible.',
        contactBtn: 'Contact via KakaoTalk Open Chat',
        contactNote: '※ No registration required. You can inquire anonymously.',
        faqH: '❓ Frequently Asked Questions',
        faqs: [
          { q: 'Q. Is the app free to use?', a: 'A. All features are free. Ads may be displayed at the bottom to support operations.' },
          { q: 'Q. Is my score data stored?', a: 'A. Current game data is only temporarily stored within the app and is never transmitted to external servers or permanently saved. You can share the result after the game ends.' },
          { q: 'Q. Do I need an internet connection?', a: 'A. Score calculation works offline. An internet connection is only needed to display ads.' },
          { q: 'Q. How many players are supported?', a: 'A. Both games support 2 to 8 players.' },
          { q: 'Q. I entered a wrong score during the game. Can I fix it?', a: 'A. Yes, you can navigate back to a previous round and re-enter the score. The total is recalculated automatically.' },
          { q: 'Q. Can I share the results?', a: 'A. After the game ends, use the "Share Results" button to share the result via KakaoTalk, Messages, or any other app.' },
          { q: 'Q. Is personal information collected?', a: 'A. No registration or personal information collection. Advertising identifiers (IDFA/AAID) are not used for tracking, and only non-personalized ads are displayed.' },
        ],
      }
    };

    const STORAGE_KEY = 'quickboard.lang';

    function applyLang(lang) {
      const t = i18n[lang] || i18n.ko;
      document.title = (lang === 'en' ? 'Support — QuickBoard' : '고객 지원 — QuickBoard');
      document.getElementById('title').textContent = t.title;
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('back-link').textContent = t.backLink;
      document.getElementById('about-h').textContent = t.aboutH;
      document.getElementById('about-b').innerHTML = t.aboutB;
      document.getElementById('contact-h').textContent = t.contactH;
      document.getElementById('contact-desc').textContent = t.contactDesc;
      document.getElementById('contact-btn').textContent = t.contactBtn;
      document.getElementById('contact-note').textContent = t.contactNote;
      document.getElementById('faq-h').textContent = t.faqH;

      const faqList = document.getElementById('faq-list');
      faqList.innerHTML = t.faqs.map(f =>
        `<div class="faq-item"><div class="faq-question">${f.q}</div><div class="faq-answer">${f.a}</div></div>`
      ).join('');

      document.documentElement.lang = lang === 'en' ? 'en' : 'ko';
      document.getElementById('btn-ko').classList.toggle('active', lang === 'ko');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    }

    function setLang(lang) {
      try { localStorage.setItem(STORAGE_KEY, lang); } catch (_) {}
      applyLang(lang);
    }

    function getInitialLang() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored === 'ko' || stored === 'en') return stored;
      } catch (_) {}
      const browserLang = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
      return browserLang.startsWith('ko') ? 'ko' : 'en';
    }

    document.getElementById('btn-ko').addEventListener('click', () => setLang('ko'));
    document.getElementById('btn-en').addEventListener('click', () => setLang('en'));
    applyLang(getInitialLang());
  </script>
</body>
</html>
